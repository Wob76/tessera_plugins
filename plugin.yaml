# Tessera fills these entity ids from the screen's plugin inputs.
defaults:
  KEG1_VOLUME: sensor.keg_scales_keg_1_remaining_volume
  KEG1_GLASSES: sensor.keg_scales_keg_1_remaining_glasses
  KEG1_FLOW: binary_sensor.keg_scales_keg_1_flow
  KEG1_LABEL: text.keg_scales_keg_1_scale_label
  KEG2_VOLUME: sensor.keg_scales_keg_2_remaining_volume
  KEG2_GLASSES: sensor.keg_scales_keg_2_remaining_glasses
  KEG2_FLOW: binary_sensor.keg_scales_keg_2_flow
  KEG2_LABEL: text.keg_scales_keg_2_scale_label

sensor:
  - platform: homeassistant
    id: keg1_volume
    entity_id: ${KEG1_VOLUME}
    internal: true
  - platform: homeassistant
    id: keg1_glasses
    entity_id: ${KEG1_GLASSES}
    internal: true
  - platform: homeassistant
    id: keg2_volume
    entity_id: ${KEG2_VOLUME}
    internal: true
  - platform: homeassistant
    id: keg2_glasses
    entity_id: ${KEG2_GLASSES}
    internal: true

text_sensor:
  - platform: homeassistant
    id: keg1_label
    entity_id: ${KEG1_LABEL}
    internal: true
  - platform: homeassistant
    id: keg2_label
    entity_id: ${KEG2_LABEL}
    internal: true

number:
  - platform: template
    id: keg1_full_capacity
    name: "Keg 1 Full Capacity"
    entity_category: config
    mode: box
    unit_of_measurement: "L"
    optimistic: true
    initial_value: 19
    restore_value: true
    min_value: 2
    max_value: 50
    step: 1
  - platform: template
    id: keg2_full_capacity
    name: "Keg 2 Full Capacity"
    entity_category: config
    mode: box
    unit_of_measurement: "L"
    optimistic: true
    initial_value: 19
    restore_value: true
    min_value: 2
    max_value: 50
    step: 1

binary_sensor:
  - platform: homeassistant
    id: keg1_flow
    entity_id: ${KEG1_FLOW}
    internal: true
  - platform: homeassistant
    id: keg2_flow
    entity_id: ${KEG2_FLOW}
    internal: true

keg_tap:
  keg1_volume: keg1_volume
  keg1_glasses: keg1_glasses
  keg1_flow: keg1_flow
  keg1_label: keg1_label
  keg1_capacity: keg1_full_capacity
  keg2_volume: keg2_volume
  keg2_glasses: keg2_glasses
  keg2_flow: keg2_flow
  keg2_label: keg2_label
  keg2_capacity: keg2_full_capacity
