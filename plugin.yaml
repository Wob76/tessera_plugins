# Tessera fills these entity ids from the screen's plugin inputs.
defaults:
  KEG1_VOLUME: sensor.keg_scales_keg_1_remaining_volume
  KEG1_GLASSES: sensor.keg_scales_keg_1_remaining_glasses
  KEG1_POUR_RATE: sensor.keg_scales_keg_1_pour_rate
  KEG1_FLOW: binary_sensor.keg_scales_keg_1_flow
  KEG2_VOLUME: sensor.keg_scales_keg_2_remaining_volume
  KEG2_GLASSES: sensor.keg_scales_keg_2_remaining_glasses
  KEG2_POUR_RATE: sensor.keg_scales_keg_2_pour_rate
  KEG2_FLOW: binary_sensor.keg_scales_keg_2_flow

sensor:
  - platform: homeassistant
    id: keg1_volume
    entity_id: ${KEG1_VOLUME}
    internal: true
  - platform: homeassistant
    id: keg1_glasses
    entity_id: ${KEG1_GLASSES}
    internal: true
  - platform: homeassistant
    id: keg1_pour_rate
    entity_id: ${KEG1_POUR_RATE}
    internal: true
  - platform: homeassistant
    id: keg2_volume
    entity_id: ${KEG2_VOLUME}
    internal: true
  - platform: homeassistant
    id: keg2_glasses
    entity_id: ${KEG2_GLASSES}
    internal: true
  - platform: homeassistant
    id: keg2_pour_rate
    entity_id: ${KEG2_POUR_RATE}
    internal: true

binary_sensor:
  - platform: homeassistant
    id: keg1_flow
    entity_id: ${KEG1_FLOW}
    internal: true
  - platform: homeassistant
    id: keg2_flow
    entity_id: ${KEG2_FLOW}
    internal: true

keg_tap:
  keg1_volume: keg1_volume
  keg1_glasses: keg1_glasses
  keg1_pour_rate: keg1_pour_rate
  keg1_flow: keg1_flow
  keg2_volume: keg2_volume
  keg2_glasses: keg2_glasses
  keg2_pour_rate: keg2_pour_rate
  keg2_flow: keg2_flow
