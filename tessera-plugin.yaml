id: keg_tap
version: 0.4.14
api: "0.8"
icon: fridge
maintainer: Wob76
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 8

permissions:
  home_assistant_actions:
    - select.select_option
  read_entities:
    - "{keg1_volume}"
    - "{keg1_glasses}"
    - "{keg1_pour_rate}"
    - "{keg1_flow}"
    - "{keg1_label}"
    - "{keg2_volume}"
    - "{keg2_glasses}"
    - "{keg2_pour_rate}"
    - "{keg2_flow}"
    - "{keg2_label}"
inputs:
  - { id: keg1_volume, kind: entity, domains: [sensor], scope: screen, label: input_keg1_volume, hint: input_keg1_volume_hint }
  - { id: keg1_glasses, kind: entity, domains: [sensor], scope: screen, label: input_keg1_glasses, hint: input_keg1_glasses_hint }
  - { id: keg1_flow, kind: entity, domains: [binary_sensor], scope: screen, label: input_keg1_flow, hint: input_keg1_flow_hint }
  - { id: keg1_label, kind: entity, domains: [text], scope: screen, label: input_keg1_label, hint: input_keg1_label_hint }
  - { id: keg2_volume, kind: entity, domains: [sensor], scope: screen, label: input_keg2_volume, hint: input_keg2_volume_hint }
  - { id: keg2_glasses, kind: entity, domains: [sensor], scope: screen, label: input_keg2_glasses, hint: input_keg2_glasses_hint }
  - { id: keg2_flow, kind: entity, domains: [binary_sensor], scope: screen, label: input_keg2_flow, hint: input_keg2_flow_hint }
  - { id: keg2_label, kind: entity, domains: [text], scope: screen, label: input_keg2_label, hint: input_keg2_label_hint }
tiles:
  - id: keg1
    name: tile_keg1
    icon: fridge
    sizes: { min: 1x1, max: 2x2 }
    memory: 5000
    example: tile_keg1_example
    options:
      - { id: action_entity, kind: text, label: input_keg1_action_entity, hint: input_action_entity_hint, default: "select.keg_scales_keg_1_control_action" }
  - id: keg2
    name: tile_keg2
    icon: fridge
    sizes: { min: 1x1, max: 2x2 }
    memory: 5000
    example: tile_keg2_example
    options:
      - { id: action_entity, kind: text, label: input_keg2_action_entity, hint: input_action_entity_hint, default: "select.keg_scales_keg_2_control_action" }

cards:
  - { id: actions, name: keg_actions_card }
